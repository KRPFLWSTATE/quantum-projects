name: reproduce
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -r requirements-repro.txt
      - name: Frozen decision-study tests
        run: python -m unittest discover -s decision-study/tests -v
      - name: Publication tests
        run: python -m unittest discover -s tools/tests -v
      - name: Offline reproduction
        run: python tools/reproduce.py --output build/reproduction
        env:
          QISKIT_IBM_TOKEN: ""
